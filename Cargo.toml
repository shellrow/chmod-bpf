[package]
name = "chmod-bpf"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["shellrow <shellrow@foctal.com>"]
description = "Manage and audit BPF device permissions on macOS"
repository = "https://github.com/shellrow/chmod-bpf"
readme = "README.md"
license = "MIT"
keywords = ["macos", "bpf", "permissions", "packet-capture", "launchd"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "src/**", "scripts/**", "resources/**", "docs/**",
    "tests/*.rs", "tests/*.py",
    "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE", "Cargo.lock",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

[target.'cfg(target_os = "macos")'.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
tempfile = "3.27"
uzers = { version = "0.12.2", default-features = false }

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
