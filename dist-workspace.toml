[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
# Keep the single-job release workflow hand-maintained.
ci = []
hosting = ["github"]
# The workflow publishes with GitHub CLI after verifying the artifacts.
create-release = false
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
unix-archive = ".tar.gz"
checksum = "sha256"
install-path = "CARGO_HOME"
install-updater = false
source-tarball = false
include = ["SECURITY.md", "docs"]
